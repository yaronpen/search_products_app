<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חיפוש מוצרים</title>
  <meta name="description" content="חיפוש חכם בקטלוג המוצרים — לפי שם, מותג או תיאור של מה שאתם צריכים">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="./" aria-label="דף הבית">finder<span class="logo-dot" aria-hidden="true"></span></a>
  </header>

  <main>
    <section class="hero">
      <h1>מה בא לכם למצוא?</h1>
      <p class="subtitle">תארו מה אתם מחפשים, אנחנו נמצא מוצרים מתאימים</p>

      <form class="search" role="search" id="search-form">
        <label for="q" class="visually-hidden">חיפוש מוצרים</label>
        <input id="q" name="q" type="search" dir="auto" autocomplete="off" maxlength="200"
               placeholder="למשל: מתנה למישהו שאוהב קפה" enterkeyhint="search">
        <button type="button" class="clear" id="clear" aria-label="ניקוי החיפוש" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button type="submit" class="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>חיפוש</span>
        </button>
      </form>

      <div class="suggestions" id="suggestions" aria-label="חיפושים לדוגמה">
        <button type="button">שואב אבק</button>
        <button type="button">iPhone 16</button>
        <button type="button">אייפון</button>
        <button type="button">מתנה למישהו שאוהב לבשל</button>
        <button type="button">משהו שיעזור לנקות שערות של כלב מהספה</button>
      </div>
    </section>

    <section class="results" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title" hidden>מצאנו מוצרים בשבילכם</h2>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
      <div class="notice" id="notice" hidden></div>
      <ul class="grid" id="grid" aria-busy="false"></ul>
      <div class="message" id="message" hidden></div>
    </section>
  </main>

  <template id="card-template">
    <li class="card">
      <div class="card-media"><img alt="" loading="lazy" decoding="async" width="600" height="600"></div>
      <div class="card-body">
        <p class="card-brand"></p>
        <h3 class="card-name"></h3>
        <p class="card-price"></p>
      </div>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
