services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/html
      - ./data:/var/www/data:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # HTTPS for production: a free Let's Encrypt certificate, renewed automatically, and HTTP -> HTTPS
  # redirects. Only starts with the "prod" profile (COMPOSE_PROFILES=prod in the server's .env), so
  # local development is unchanged. On the server, also set APP_PORT=127.0.0.1:8080 so Caddy is the
  # only public entry point.
  caddy:
    image: caddy:2
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}  # required with the prod profile; Caddy refuses to start without it
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # the certificate; keep it to avoid Let's Encrypt rate limits
      - caddy_config:/config
    depends_on:
      - app

volumes:
  dbdata:
  caddy_data:
  caddy_config:
