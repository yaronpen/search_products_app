<VirtualHost *:80>
    DocumentRoot /var/www/html

    # Every /api/* request goes to the PHP front controller; the backend code itself
    # lives outside the web root and is never served directly.
    AliasMatch "^/api(/.*)?$" "/var/www/backend/public/index.php"
    <Directory /var/www/backend/public>
        Require all granted
    </Directory>

    <Directory /var/www/html>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
